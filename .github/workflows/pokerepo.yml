name: pokerepo

on:
  schedule: [{ cron: "0 21 * * *" }]   # 매일 06:00 KST
  workflow_dispatch:

permissions: { contents: write }

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 최신 커밋순 정렬 패치를 적용한 포크
      - uses: dhtkddbs01/pokerepo@v1-recency
        with:
          party: "3"         # 최근 커밋한 3개 저장소만
          columns: "1"       # 세로로 한 줄에 하나씩
          sprite: showdown   # 전 세대 애니메이션 스프라이트 (기본 animated 는 5세대까지만)
