name: pokerepo

on:
  schedule: [{ cron: "0 21 * * *" }]   # 매일 06:00 KST
  workflow_dispatch:

permissions: { contents: write }

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 최신 커밋순 정렬 패치를 적용한 포크
      - uses: dhtkddbs01/pokerepo@v1-recency
        with:
          party: "3"         # 최근 커밋한 3개 저장소만
          columns: "1"       # 세로로 한 줄에 하나씩
          sprite: showdown   # 전 세대 애니메이션 스프라이트 (기본 animated 는 5세대까지만)
          order: level       # 최신 3개를 고른 뒤, 그 안에서는 레벨 높은 순으로 표시
          dex-label: 진행한 모든 프로젝트 목록
          tiers: "0:All"     # 희귀도 등급 없이 전체 종에서 배정 (기본값은 원본 저장소 스타 수로 등급을 나눔)
